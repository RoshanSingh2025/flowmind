[tool.poetry]
name = "flowmind-backend"
version = "0.1.0"
description = "FlowMind backend — AI Workflow Copilot API (FastAPI, Clean Architecture)"
authors = ["FlowMind Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.6" }
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
aiosqlite = "^0.20.0"
alembic = "^1.13.3"
structlog = "^24.4.0"
redis = "^5.0.8"
qdrant-client = "^1.11.2"
python-multipart = "^0.0.9"
httpx = "^0.27.2"
aiofiles = "^24.1.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.9"
black = "^24.8.0"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ------------------------------------------------------------------
# Ruff
# ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "SIM",              # simplify
  "ASYNC",            # async lint rules
]
ignore = ["B008"]  # allow FastAPI's Depends(...) as default arg

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ------------------------------------------------------------------
# Black
# ------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
exclude = "alembic/versions"

# ------------------------------------------------------------------
# Pytest
# ------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env_files = [".env.test"]